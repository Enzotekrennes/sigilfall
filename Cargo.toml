[workspace]
resolver = "3"
members = ["crates/sigilfall-core", "crates/sigilfall"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# ratatui 0.30 (terminal rendering) requires Rust 1.88, above the 1.85
# minimum of edition 2024; one minimum applies to the whole workspace.
rust-version = "1.88"
authors = ["Enzo Abel"]
license = "MIT OR Apache-2.0"
# The release installers download from this repository.
repository = "https://github.com/Enzotekrennes/sigilfall"
homepage = "https://github.com/Enzotekrennes/sigilfall"
readme = "README.md"
keywords = ["roguelike", "game", "terminal", "tui", "sigil"]
categories = ["games", "command-line-utilities"]

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
missing_docs_in_private_items = "warn"

# The profile `dist` builds release binaries with (dist-workspace.toml): the
# release profile, plus thin link-time optimisation for a smaller, faster
# binary at a moderate build cost.
[profile.dist]
inherits = "release"
lto = "thin"

# Debug builds and tests with optimised game rules. The tests of generation,
# sight and pursuit play thousands of seeds, which unoptimised code made
# slow on every CI system (the cave tests took 87 s, 5 s optimised).
# Debug assertions and overflow checks stay on; only the terminal binary
# keeps opt-level 0, for quick rebuilds of the screens.
[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.sigilfall-core]
opt-level = 2
