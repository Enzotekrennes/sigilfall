[workspace]
resolver = "3"
members = ["crates/sigilfall-core", "crates/sigilfall"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# Edition 2024 requires at least Rust 1.85.
rust-version = "1.85"
authors = ["Enzo Abel"]
license = "MIT OR Apache-2.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
missing_docs_in_private_items = "warn"
