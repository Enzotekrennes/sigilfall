[workspace]
resolver = "3"
members = ["crates/sigilfall-core", "crates/sigilfall"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# ratatui 0.30 (terminal rendering) requires Rust 1.88, above the 1.85
# minimum of edition 2024; one minimum applies to the whole workspace.
rust-version = "1.88"
authors = ["Enzo Abel"]
license = "MIT OR Apache-2.0"
# OWNER is a placeholder until the GitHub repository exists (phase 6): the
# release installers download from this URL, so replace it before tagging.
repository = "https://github.com/OWNER/sigilfall"
homepage = "https://github.com/OWNER/sigilfall"
readme = "README.md"
keywords = ["roguelike", "game", "terminal", "tui", "sigil"]
categories = ["games", "command-line-utilities"]

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
missing_docs_in_private_items = "warn"

# The profile `dist` builds release binaries with (dist-workspace.toml): the
# release profile, plus thin link-time optimisation for a smaller, faster
# binary at a moderate build cost.
[profile.dist]
inherits = "release"
lto = "thin"
