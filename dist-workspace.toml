# Release configuration read by `dist` (cargo-dist): which binaries are built
# for which platforms when a version tag such as v0.1.0 is pushed, and how
# players install them. `dist generate` writes .github/workflows/release.yml
# from this file; edit this file, run `dist generate` again, then reapply
# the hardening listed next to `allow-dirty` below. The download URLs come
# from `repository` in Cargo.toml.

[workspace]
members = ["cargo:."]

[dist]
# Version of dist the release workflow installs (Cargo.toml SemVer syntax).
cargo-dist-version = "0.34.0"
# Generate the GitHub Actions workflow, triggered by a pushed version tag.
ci = "github"
# A shell script for Linux and macOS, a PowerShell script for Windows: each
# downloads the right archive from the GitHub release and puts the binary on
# the PATH.
installers = ["shell", "powershell"]
# Windows (MSVC), Linux (glibc, x86_64), macOS Intel and Apple Silicon.
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
]
# Installers place the binary where `cargo install` would, already on the
# PATH of anyone with a Rust toolchain, and in ~/.cargo/bin otherwise.
install-path = "CARGO_HOME"
# No self-updater: one binary, updated by running the installer again.
install-updater = false
# Shipped in every archive next to the binary, README and LICENSE-* files
# (which dist adds on its own): the notices of the crates compiled into the
# binary, generated by cargo-about (about.toml), and the French README, which
# dist does not pick up as it does README.md.
include = ["THIRD-PARTY-LICENSES", "README.fr.md"]

# release.yml is the output of `dist generate` plus hardening that dist 0.34
# cannot express in this file, so dist must not refuse it as out of date.
# After `dist generate`, reapply these changes (each is marked "Hardening:"
# in release.yml):
# - `permissions: contents: read` for the workflow, `contents: write` only on
#   the `host` job that publishes (dist writes `contents: write` at the top);
# - no GH_TOKEN in the build jobs, which never call the GitHub API;
# - no `${{ }}` expression inside a `run:` script: values go through `env:`;
# - dist installed by .github/actions/install-dist (archive checked against a
#   pinned SHA-256) instead of `curl | sh` of an unchecked installer;
# - the two "paths<<EOF" blocks grouped under one redirect, so actionlint
#   (shellcheck SC2129) passes.
# The action pins below are applied by dist itself.
allow-dirty = ["ci"]

# dist picks a runner for each target, and one for the jobs that run once
# (plan, global artifacts, host, announce). Every runner is pinned to a
# versioned image: GitHub cancels any job whose image it has retired, so each
# one must name an image GitHub still offers (when it announces the
# retirement of one, move to the next), and a versioned image, rather than a
# `-latest` label, keeps the toolchain from changing under a release without
# a change here.
# - macOS: both targets build on Apple Silicon; the Intel binary is
#   cross-compiled, as Intel macOS runners are being retired.
# - Linux: ubuntu-24.04, as ubuntu-22.04 (the dist default) is deprecated and
#   unsupported from April 2027. The binary links the glibc of the build
#   image, so this sets the oldest glibc the Linux archive runs on.
# - Windows: windows-2022, the dist default made explicit (MSVC from
#   Visual Studio 2022).
[dist.github-custom-runners]
x86_64-apple-darwin = "macos-15"
aarch64-apple-darwin = "macos-15"
x86_64-unknown-linux-gnu = "ubuntu-24.04"
x86_64-pc-windows-msvc = "windows-2022"
global = "ubuntu-24.04"

# The actions release.yml uses, pinned to a commit so a moved tag cannot
# change what runs. The text after the SHA lands in release.yml as a YAML
# comment giving the version; Dependabot (.github/dependabot.yml) proposes
# updates, to be copied here before the next `dist generate`.
[dist.github-action-commits]
"actions/checkout" = "d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0"
"actions/upload-artifact" = "cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2"
"actions/download-artifact" = "9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2"
