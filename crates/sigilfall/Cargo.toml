[package]
name = "sigilfall"
description = "Terminal roguelike where spells are cast by tracing sigils on the keyboard."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

# The Windows installer (.msi) built by dist from wix/main.wxs. The GUIDs must
# never change: upgrade-guid lets a new version replace the installed one,
# path-guid identifies the PATH entry it adds. No license or EULA page.
[package.metadata.wix]
upgrade-guid = "7E482B53-8719-4E45-963C-8E8E1785D515"
path-guid = "17880C79-158D-4DFA-80CF-BD0BEECC4038"
license = false
eula = false

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "wrap_help"] }
directories = "6.0.0"
rand = "0.10.3"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
ron = "0.12.3"
serde = { version = "1.0.229", features = ["derive"] }
sigilfall-core = { version = "0.1.0", path = "../sigilfall-core" }
sys-locale = "0.3.2"

[dev-dependencies]
insta = "1.49.0"
# The game rules with their test helpers (hand-made rooms, placed monsters).
sigilfall-core = { version = "0.1.0", path = "../sigilfall-core", features = ["test-support"] }
