[package]
name = "sigilfall-core"
description = "Game logic of Sigilfall, independent of any terminal or rendering library."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
rand = { version = "0.10.3", default-features = false }
rand_chacha = { version = "0.10.0", default-features = false, features = ["serde"] }
ron = { version = "0.12.3", features = ["integer128"] }
serde = { version = "1.0.229", features = ["derive"] }
slotmap = { version = "1.1.1", features = ["serde"] }
thiserror = "2.0.21"

[dev-dependencies]
insta = "1.49.0"
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
